<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Linux runners lack the Windows fonts the graphics use; map them to open-licence look-alikes. -->
<fontconfig>
  <alias binding="same"><family>Bahnschrift</family><prefer><family>Barlow Semi Condensed</family></prefer></alias>
  <alias binding="same"><family>Georgia</family><prefer><family>Gelasio</family></prefer></alias>
</fontconfig>
