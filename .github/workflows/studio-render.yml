name: Studio Render

# Dispatched by the Video Studio web app (app/services/github_renderer.py). The release holds one
# studio-<job>.zip with director_edit.json at its root; the app downloads the artifact named video-<stem>.
run-name: Studio render ${{ inputs.queue_id }}

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the Studio package zip"
        required: true
        type: string
      chunk_workers:
        description: "Parallel chunk workers"
        required: false
        type: string
        default: "20"
      render_scale:
        description: "1 = 1080p, 2 = 4K"
        required: false
        type: string
        default: "1"
      queue_id:
        description: "Studio queue id (shown in the run name)"
        required: false
        type: string
        default: "manual"

permissions:
  contents: write
  actions: read

jobs:
  plan:
    name: Plan chunks
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      chunk_count: ${{ steps.plan.outputs.chunk_count }}
      zip_name: ${{ steps.plan.outputs.zip_name }}
      stem: ${{ steps.plan.outputs.stem }}
    steps:
      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p incoming
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "*.zip" --dir incoming
          ls -lh incoming

      - name: Build chunk matrix
        id: plan
        shell: bash
        env:
          WORKERS: ${{ inputs.chunk_workers }}
        run: |
          set -euo pipefail
          mapfile -t zips < <(ls incoming/*.zip)
          if [ "${#zips[@]}" -ne 1 ]; then
            echo "::error::Expected exactly one zip in the release, found ${#zips[@]}."
            exit 1
          fi
          zip_name="$(basename "${zips[0]}")"
          unzip -p "${zips[0]}" director_edit.json > edit.json
          node -e '
            const fs = require("node:fs");
            const edit = JSON.parse(fs.readFileSync("edit.json", "utf8"));
            const total = Math.round(Number(edit.totalFrames));
            if (!Number.isFinite(total) || total < 1) { console.error("::error::director_edit.json has no totalFrames"); process.exit(1); }
            const workers = Math.max(1, Math.min(60, Number(process.env.WORKERS) || 20));
            const count = Math.max(1, Math.min(workers, Math.ceil(total / 300)));  // chunks of at least ~10 s
            const size = Math.ceil(total / count);
            const chunks = [];
            for (let i = 0, s = 0; s < total; i++, s += size) {
              chunks.push({chunk_id: String(i).padStart(3, "0"), frames: `${s}-${Math.min(total, s + size) - 1}`});
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `chunks=${JSON.stringify({include: chunks})}\nchunk_count=${chunks.length}\n`);
            console.log(`${total} frames -> ${chunks.length} chunks of up to ${size}`);
          '
          echo "zip_name=$zip_name" >> "$GITHUB_OUTPUT"
          echo "stem=${zip_name%.zip}" >> "$GITHUB_OUTPUT"

  render-chunks:
    name: Render chunk ${{ matrix.chunk_id }}
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.chunks) }}
    defaults:
      run:
        working-directory: studio
    steps:
      - name: Checkout renderer
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation fonts-noto-core ffmpeg
          fc-cache -f

      - name: Download package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ZIP_NAME: ${{ needs.plan.outputs.zip_name }}
        run: |
          rm -rf incoming out
          mkdir -p incoming out public
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir incoming
          unzip -q -o "incoming/$ZIP_NAME" -d public
          rm -rf incoming
          test -f public/director_edit.json

      - name: Render chunk
        shell: bash
        env:
          STEM: ${{ needs.plan.outputs.stem }}
          FRAMES: ${{ matrix.frames }}
          CHUNK: ${{ matrix.chunk_id }}
          SCALE: ${{ inputs.render_scale }}
        run: |
          set -euo pipefail
          case "$SCALE" in 1|2) ;; *) SCALE=1 ;; esac
          output="out/${STEM}_chunk_${CHUNK}.mp4"
          check_ts="out/check.ts"
          start="${FRAMES%-*}"
          end="${FRAMES#*-}"
          fps="$(node -p "Number(require('./public/director_edit.json').fps || 30)")"
          expected="$(node -e "const [s,e,f]=process.argv.slice(1).map(Number); process.stdout.write(String((e-s+1)/f))" "$start" "$end" "$fps")"
          rendered=false
          for attempt in 1 2 3; do
            echo "Render attempt $attempt/3"
            rm -f "$output" "$check_ts"
            if npx remotion render src/render.ts DirectorJob "$output" \
                --codec=h264 --crf=21 --muted --scale="$SCALE" \
                --frames="$FRAMES" --concurrency=2; then
              actual="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$output" || true)"
              if node -e 'const [a,e]=process.argv.slice(1).map(Number); process.exit(Number.isFinite(a) && Math.abs(a-e) <= 0.5 ? 0 : 1)' "$actual" "$expected" && \
                 ffmpeg -hide_banner -y -v error -xerror -err_detect explode \
                   -i "$output" -map 0:v:0 -an -c:v copy -bsf:v h264_mp4toannexb -f mpegts "$check_ts"; then
                rm -f "$check_ts"
                echo "Chunk OK: ${actual}s / ${expected}s"
                rendered=true
                break
              fi
            fi
            echo "::warning::Chunk $CHUNK attempt $attempt failed validation, retrying."
          done
          if [ "$rendered" != true ]; then
            echo "::error::Chunk $CHUNK failed three attempts."
            exit 1
          fi

      - name: Upload chunk
        uses: actions/upload-artifact@v4
        with:
          name: chunk-${{ needs.plan.outputs.stem }}-${{ matrix.chunk_id }}
          path: studio/out/${{ needs.plan.outputs.stem }}_chunk_${{ matrix.chunk_id }}.mp4
          if-no-files-found: error
          retention-days: 2

  combine:
    name: Combine and add narration
    needs: [plan, render-chunks]
    runs-on: ubuntu-latest
    steps:
      - name: Download chunks
        uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ needs.plan.outputs.stem }}-*
          merge-multiple: true
          path: chunks

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Download package for narration
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ZIP_NAME: ${{ needs.plan.outputs.zip_name }}
        run: |
          set -euo pipefail
          mkdir -p incoming pkg out
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$ZIP_NAME" --dir incoming
          unzip -p "incoming/$ZIP_NAME" director_edit.json > pkg/director_edit.json
          audio="$(node -p "require('./pkg/director_edit.json').audio || ''")"
          if [ -z "$audio" ]; then
            echo "::error::director_edit.json has no audio entry."
            exit 1
          fi
          unzip -q -o "incoming/$ZIP_NAME" "$audio" -d pkg
          test -s "pkg/$audio"
          echo "AUDIO=pkg/$audio" >> "$GITHUB_ENV"
          rm -rf incoming

      - name: Stitch chunks and mux narration
        shell: bash
        env:
          STEM: ${{ needs.plan.outputs.stem }}
          EXPECTED_CHUNKS: ${{ needs.plan.outputs.chunk_count }}
        run: |
          set -euo pipefail
          check() {
            node -e '
              const [label, a, e] = process.argv.slice(1);
              const d = Math.abs(Number(a) - Number(e));
              if (!Number.isFinite(Number(a)) || d > 1.0) { console.error(`::error::${label} duration ${a}s vs expected ${e}s`); process.exit(1); }
              console.log(`${label} duration OK: ${Number(a).toFixed(3)}s / ${Number(e).toFixed(3)}s`);
            ' "$1" "$2" "$3"
          }
          dur() {
            ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$1"
          }

          fps="$(node -p "Number(require('./pkg/director_edit.json').fps || 30)")"
          expected="$(node -p "const e=require('./pkg/director_edit.json'); e.totalFrames / (e.fps || 30)")"
          mapfile -t files < <(find chunks -type f -name "${STEM}_chunk_*.mp4" | sort)
          if [ "${#files[@]}" -ne "$EXPECTED_CHUNKS" ]; then
            echo "::error::Expected $EXPECTED_CHUNKS chunks, got ${#files[@]}."
            exit 1
          fi

          mkdir -p ts
          : > list.txt
          for f in "${files[@]}"; do
            t="ts/$(basename "$f" .mp4).ts"
            ffmpeg -hide_banner -y -v error -xerror -err_detect explode \
              -i "$f" -map 0:v:0 -an -c:v copy -bsf:v h264_mp4toannexb -f mpegts "$t"
            # Exact per-chunk length (frames / fps) so concat never overlaps chunks ("Non-monotonic DTS").
            frames="$(ffprobe -v error -select_streams v:0 -count_packets -show_entries stream=nb_read_packets -of default=noprint_wrappers=1:nokey=1 "$f")"
            echo "file '$(realpath "$t")'" >> list.txt
            echo "duration $(node -e "process.stdout.write((Number(process.argv[1])/Number(process.argv[2])).toFixed(6))" "$frames" "$fps")" >> list.txt
          done

          ffmpeg -hide_banner -y -v error -xerror -f concat -safe 0 -i list.txt -map 0:v:0 -an -c:v copy out/silent.mp4
          check "Silent video" "$(dur out/silent.mp4)" "$expected"

          # No -shortest: a short video must fail the checks, not silently trim the narration.
          ffmpeg -hide_banner -y -v error -xerror -i out/silent.mp4 -i "$AUDIO" \
            -map 0:v:0 -map 1:a:0 -c:v copy -c:a aac -b:a 192k -t "$expected" -movflags +faststart \
            "out/${STEM}.mp4"

          streams="$(ffprobe -v error -show_entries stream=codec_type -of csv=p=0 "out/${STEM}.mp4")"
          if ! grep -qx video <<< "$streams" || ! grep -qx audio <<< "$streams"; then
            echo "::error::Final MP4 is missing video or audio. Found: $streams"
            exit 1
          fi
          check "Final MP4" "$(dur "out/${STEM}.mp4")" "$expected"
          ffmpeg -hide_banner -v error -xerror -err_detect explode -i "out/${STEM}.mp4" -map 0:v:0 -map 0:a:0 -c copy -f null -

      - name: Upload final video
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ needs.plan.outputs.stem }}
          path: out/${{ needs.plan.outputs.stem }}.mp4
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
